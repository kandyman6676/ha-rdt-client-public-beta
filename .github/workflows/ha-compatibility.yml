name: Minimal Home Assistant compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ha-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install 'homeassistant==2026.11.2' 'pytest-homeassistant==2026.11.2'
      - run: python -m pytest -q -o asyncio_mode=auto ha_tests
